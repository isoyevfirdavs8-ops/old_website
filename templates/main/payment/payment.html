{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2>Secure Payment</h2>

                        <p class="text-muted">

                            Complete your payment

                        </p>

                    </div>

                    <form
                        method="post"
                        action="{% url 'process_payment' %}"
                    >

                        {% csrf_token %}

                        <input
                            type="hidden"
                            name="payment_id"
                            value="{{ payment.id }}"
                        >

                        <div class="mb-4">

                            <label class="form-label">

                                Card Number

                            </label>

                            <input

                                type="text"

                                class="form-control form-control-lg"

                                maxlength="16"

                                minlength="16"

                                name="card_number"

                                placeholder="8600 1234 5678 9012"

                                required

                            >

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-4">

                                    <label>

                                        Expiry

                                    </label>

                                    <input

                                        type="text"

                                        class="form-control"

                                        placeholder="12/30"

                                        name="expiry"

                                        required

                                    >

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-4">

                                    <label>

                                        CVV

                                    </label>

                                    <input

                                        type="password"

                                        maxlength="3"

                                        class="form-control"

                                        name="cvv"

                                        required

                                    >

                                </div>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label>

                                Amount

                            </label>

                            <input

                                class="form-control"

                                value="{{ payment.amount }}"

                                readonly

                            >

                        </div>

                        <button

                            class="btn btn-success w-100 btn-lg"

                        >

                            Pay Now

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
