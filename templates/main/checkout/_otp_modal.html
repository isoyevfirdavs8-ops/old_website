<div
    class="modal fade"
    id="otpModal"
    tabindex="-1"
    aria-labelledby="otpModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content otp-modal border-0">

            <div class="modal-body p-5">

                <!-- Close Button -->

                <button
                    type="button"
                    class="btn-close position-absolute top-0 end-0 m-4"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

                <!-- Icon -->

                <div class="text-center mb-4">

                    <div class="otp-icon">

                        📱

                    </div>

                </div>

                <!-- Title -->

                <h3
                    class="fw-bold text-center mb-2"
                    id="otpModalLabel"
                >

                    Verify Phone Number

                </h3>

                <p
                    class="text-muted text-center mb-4"
                >

                    We have sent a 6-digit verification code

                </p>



                <!-- OTP INPUTS -->

                <div
                    class="otp-container mb-4"
                >

                    <input
                        class="otp-input"
                        maxlength="1"
                        type="text"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        type="text"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        type="text"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        type="text"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        type="text"
                        inputmode="numeric"
                    >

                    <input
                        class="otp-input"
                        maxlength="1"
                        type="text"
                        inputmode="numeric"
                    >

                </div>

                <!-- Error -->

                <div
                    id="otpError"
                    class="text-danger text-center small mb-3 d-none"
                >

                    Invalid verification code.

                </div>

                <!-- Verify -->

                <button
                    id="verifyOTP"
                    class="btn btn-dark w-100 py-3 rounded-3 fw-semibold"
                >

                    Verify Code

                </button>

                <!-- Timer -->

                <div
                    class="text-center mt-4"
                >

                    <span class="text-muted">

                        Resend code in

                    </span>

                    <span
                        id="countdown"
                        class="fw-bold"
                    >

                        00:60

                    </span>

                </div>

                <!-- Resend -->

                <div class="text-center mt-3">

                    <button
                        id="resendOTP"
                        class="btn btn-link text-decoration-none fw-semibold d-none"
                    >

                        Resend Code

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
