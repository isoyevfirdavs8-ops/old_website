{% extends "dashboard/base.html" %}

{% block title %}
Delete Product
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0">

                <div class="card-header bg-danger text-white">

                    <h4 class="mb-0">

                        Delete Product

                    </h4>

                </div>

                <div class="card-body">

                    <p class="fs-5">

                        Are you sure you want to delete

                        <strong>

                            "{{ object.title }}"

                        </strong>

                        ?

                    </p>

                    <p class="text-muted">

                        Product images and sizes will also be deleted.

                    </p>

                    <form method="post">

                        {% csrf_token %}

                        <a href="{% url 'product_list' %}"

                           class="btn btn-secondary">

                            Cancel

                        </a>

                        <button

                            class="btn btn-danger">

                            Delete

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
