<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3">

    <div class="container-fluid">

        <!-- Mobile Menu Button -->

        <button class="btn btn-outline-secondary d-lg-none"
                id="menu-btn">

            <i class="bi bi-list fs-4"></i>

        </button>

        <!-- Search -->

        <form class="d-none d-md-flex ms-3 flex-grow-1">

            <div class="input-group" style="max-width:450px;">

                <span class="input-group-text bg-white border-end-0">

                    <i class="bi bi-search"></i>

                </span>

                <input
                        type="search"
                        class="form-control border-start-0"
                        placeholder="Search products...">

            </div>

        </form>

        <!-- Right Menu -->

        <div class="d-flex align-items-center ms-auto">

            <!-- Notification -->

            <div class="dropdown me-3">

    <button
        class="btn position-relative"

        data-bs-toggle="dropdown">

        <i class="bi bi-bell fs-5"></i>

        {% if navbar_unread %}

        <span

            id="notification-count"

            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

            {{ navbar_unread }}

        </span>

        {% endif %}

    </button>

    <div
            id="notification-list"
        class="dropdown-menu dropdown-menu-end shadow"

        style="width:360px;">

        <div class="dropdown-header fw-bold">

            Notifications

        </div>

        <hr class="dropdown-divider">

        {% for notification in navbar_notifications %}

        <a
            href="#"

            class="dropdown-item py-3">

            <strong>

                {{ notification.title }}

            </strong>

            <br>

            <small class="text-muted">

                {{ notification.message }}

            </small>

            <br>

            <small class="text-secondary">

                {{ notification.created_at|timesince }} ago

            </small>

        </a>

        {% empty %}

        <div class="text-center py-4 text-muted">

            No notifications

        </div>

        {% endfor %}

</div>

            <!-- User -->

            <div class="dropdown">

                <button class="btn dropdown-toggle"
                        data-bs-toggle="dropdown">

                    <i class="bi bi-person-circle fs-5 me-2"></i>

                    {{ request.user.username }}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>

                       <a class="dropdown-item"
                           href="#">

                            <i class="bi bi-person me-2"></i>

                            My Profile

                        </a>

                    </li>

                           href="#">

                            Settings

                            Logout

                        </a>

                    </li>

                </ul>

            </div>
