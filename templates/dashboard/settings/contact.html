{% extends "dashboard/base.html" %}
{% load static %}

{% block title %}
Contact Settings
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header">

            <h4 class="mb-0">

                Contact Settings

            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label>

                            Phone

                        </label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ settings.phone }}"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-4">

                        <label>

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            value="{{ settings.email }}"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-4">

                        <label>

                            Working Hours

                        </label>

                        <input
                            type="text"
                            name="working_hours"
                            value="{{ settings.working_hours }}"
                            class="form-control">

                    </div>

                    <div class="col-12 mb-4">

                        <label>

                            Address

                        </label>

                        <textarea
                            name="address"
                            rows="5"
                            class="form-control">{{ settings.address }}</textarea>

                    </div>

                </div>

                <button
                    class="btn btn-dark">

                    Save Contact

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
