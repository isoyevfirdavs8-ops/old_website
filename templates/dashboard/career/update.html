{% extends "dashboard/base.html" %}
{% load static %}

{% block title %}
Update Career
{% endblock %}

{% block extra_css %}

<link rel="stylesheet"
      href="{% static 'dashboard/css/career/form.css' %}">

{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white py-3">

            <h4 class="mb-0">

                <i class="bi bi-pencil-square text-warning"></i>

                Update Career

            </h4>

        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-4">

                    <label class="form-label">

                        Sub Category

                    </label>

                    {{ form.subcategory }}

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Career Name

                    </label>

                    {{ form.name }}

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        About

                    </label>

                    {{ form.about }}

                </div>

                <hr>

                <div class="d-flex justify-content-end">

                    <a href="{% url 'career_list' %}"
                       class="btn btn-light me-2">

                        Cancel

                    </a>

                    <button class="btn btn-warning">

                        <i class="bi bi-check-lg"></i>

                        Update Career

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
