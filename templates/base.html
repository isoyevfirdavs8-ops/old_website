{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Dunyo Textile
        {% endblock %}
    </title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- VARIABLES -->

    <link rel="stylesheet"
          href="{% static 'main/css/variables.css' %}">

    <!-- MAIN -->

    <link rel="stylesheet"
          href="{% static 'main/css/main.css' %}">

    <!-- HEADER -->

    <link rel="stylesheet"
          href="{% static 'main/css/header/header.css' %}">



    <link rel="stylesheet"
          href="{% static 'main/css/hero.css' %}">


    <!-- FOOTER -->
    <link rel="stylesheet" href="{% static 'main/css/footer/footer.css' %}">


    <!-- COMPONENTS -->

    <link rel="stylesheet"
          href="{% static 'main/css/components/card.css' %}">

    <link rel="stylesheet"
          href="{% static 'main/css/components/button.css' %}">

    <!-- PAGE CSS -->

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- HEADER -->

    {% include "main/includes/header/header.html" %}

    <!-- CONTENT -->

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- FOOTER -->

    {% include "main/footer/footer.html" %}

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MAIN JS -->

    <script src="{% static 'main/js/main.js' %}"></script>

    <!-- HEADER JS -->

    <script src="{% static 'main/js/header/header.js' %}"></script>

    <script src="{% static 'main/js/header/search.js' %}"></script>
    <script src="{% static 'main/js/footer/footer.js' %}"></script>

    <script src="{% static 'main/js/header/mobile-menu.js' %}"></script>

    <script src="{% static 'main/js/header/mega-menu.js' %}"></script>

    <script src="{% static 'main/js/header/top-bar.js' %}"></script>

    <!-- PAGE JS -->
    <script src="{% static 'main/js/hero.js' %}"></script>
    {% block extra_js %}
    <script src="{% static 'main/js/wishlist.js' %}"></script>
    {% endblock %}

</body>

</html>
